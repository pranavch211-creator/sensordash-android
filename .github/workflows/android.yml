name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Bootstrap Gradle wrapper (first run only)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper
            git commit -m "Add Gradle wrapper (generated by CI)"
            git push || echo "::warning::Could not push the wrapper; continuing with the generated copy"
          fi
          chmod +x gradlew

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sensordash.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sensordash.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. The APK is signed with a temporary debug key, so a later build cannot be installed over this one (uninstall first)."
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SensorDash-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SensorDash-debug-apk
          path: SensorDash-debug.apk
          retention-days: 14

      - name: Publish to rolling release "latest-debug"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug SensorDash-debug.apk \
            --prerelease \
            --title "SensorDash debug (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Debug build for personal testing." \
            --target "$GITHUB_SHA"